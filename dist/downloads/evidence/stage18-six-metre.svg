<svg xmlns="http://www.w3.org/2000/svg" width="990" height="590" viewBox="0 0 990 590"><rect width="990" height="590" fill="#edf1e8"/><text x="20" y="28" font-size="20">SM1 / BR3 six-metre command paths (not WebGL)</text><rect x="502.3999999999999" y="86.88" width="368" height="168" fill="#becdb8" fill-opacity=".5" stroke="#55715c"/><text x="517.3999999999999" y="141.88" font-size="18">SM1</text><rect x="116" y="254.88000000000002" width="368" height="168" fill="#becdb8" fill-opacity=".5" stroke="#55715c"/><text x="131" y="309.88" font-size="18">BR3</text><polyline points="532.30,86.88 484.00,86.74 484.00,254.88 454.10,254.88" fill="none" stroke="#bd692d" stroke-width="4" /><polyline points="454.10,254.88 484.00,254.88 484.00,86.74 532.30,86.74 532.30,86.88" fill="none" stroke="#246aa0" stroke-width="4" stroke-dasharray="5 6"/><text x="20" y="510" font-size="16">Height difference: 6m. Edge gap: 0.4m. Orange: down / dashed blue: up.</text><text x="20" y="540" font-size="14">Body envelopes shown for context. Lines follow capsule-verified paths outside the upper wall.</text><text x="20" y="568" font-size="14">Vertical coordinates use player datum; visible soles are 0.16m above it.</text></svg>